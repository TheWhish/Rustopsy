name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Safety guard
        shell: bash
        run: |
          forbidden='OpenProcess|allProcesses|ReadProcessMemory|WriteProcessMemory|CreateRemoteThread|SendInput|keybd_event|mouse_event|SetWindowsHookEx|WH_KEYBOARD_LL|WH_MOUSE_LL|java\.awt\.Robot|jnativehook|SetWindowDisplayAffinity|FindWindow|EnumWindows|SetParent|GetForegroundWindow'
          if git grep -nIE "$forbidden" -- '*.kt' '*.kts' '*.toml'; then
            echo "Forbidden API found, see docs/SAFETY.md"
            exit 1
          fi
          if ./gradlew -q :desktopApp:dependencies --configuration runtimeClasspath | grep -i jnativehook; then
            echo "Forbidden dependency found, see docs/SAFETY.md"
            exit 1
          fi

      - name: Tests
        run: ./gradlew :core:jvmTest :shared:jvmTest :server:test -q

      - name: Server jar
        run: ./gradlew :server:buildFatJar -q

      - uses: actions/upload-artifact@v6
        with:
          name: rustopsy-server
          path: server/build/libs/rustopsy-server.jar

      - name: Package MSI
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :desktopApp:packageMsi -q

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Rustopsy-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  deploy-server:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-server
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: rustopsy-server

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is not set, skipping deploy"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes deploy@thewhish.xyz < rustopsy-server.jar
